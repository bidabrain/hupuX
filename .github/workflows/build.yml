name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Android APK ───────────────────────────────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/*.apk

  # ── macOS ARM .dmg ────────────────────────────────────────────────────────────
  macos:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Package DMG
        run: ./gradlew :desktopApp:packageDmg

      - name: Rename DMG
        run: mv desktopApp/build/compose/binaries/main/dmg/*.dmg desktopApp/build/compose/binaries/main/dmg/HupuX-arm64.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm
          path: desktopApp/build/compose/binaries/main/dmg/HupuX-arm64.dmg

  # ── macOS Intel .dmg ──────────────────────────────────────────────────────────
  macos-intel:
    name: macOS DMG (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Package DMG
        run: ./gradlew :desktopApp:packageDmg

      - name: Rename DMG
        run: mv desktopApp/build/compose/binaries/main/dmg/*.dmg desktopApp/build/compose/binaries/main/dmg/HupuX-intel.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-intel
          path: desktopApp/build/compose/binaries/main/dmg/HupuX-intel.dmg

  # ── Windows .msi ──────────────────────────────────────────────────────────────
  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Package MSI
        run: ./gradlew :desktopApp:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  # ── Linux .deb ────────────────────────────────────────────────────────────────
  linux:
    name: Linux DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Package DEB
        run: ./gradlew :desktopApp:packageDeb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb

  # ── iOS 未签名 IPA ────────────────────────────────────────────────────────────
  # 说明：未加入 Apple Developer Program，产物为「未签名」IPA，无法直接安装到 iPhone，
  # 用户需用自己的 Apple ID 自行签名侧载（Sideloadly / AltStore），或用 Xcode 直装。
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build unsigned .app (device arm64)
        run: |
          cd ios/HupuX
          xcodebuild -project HupuX.xcodeproj -scheme HupuX \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          cd ios/HupuX/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R HupuX.app Payload/
          zip -qr HupuX-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/HupuX/build/Build/Products/Release-iphoneos/HupuX-unsigned.ipa

  # ── GitHub Release（推送到 main 时触发）──────────────────────────────────────
  release:
    name: Publish Release
    needs: [ android, macos, macos-intel, windows, linux, ios ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/macos-dmg-arm/*.dmg
            artifacts/macos-dmg-intel/*.dmg
            artifacts/windows-msi/*.msi
            artifacts/linux-deb/*.deb
            artifacts/ios-ipa/*.ipa
